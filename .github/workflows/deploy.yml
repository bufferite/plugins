# Scaffold workflow. Pin every action to a commit SHA before production.
# D13: the index is signed offline. This workflow only deploys a committed,
# signed index after verifying that it matches a deterministic rebuild.
name: Deploy signed registry

on:
  push:
    branches: [main]
    paths:
      - release/registry.json
      - release/registry.json.sig
      - keys/registry_keys.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: registry-publish
    steps:
      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Bufferite tooling
        uses: actions/checkout@v4
        with:
          repository: bufferite/bufferite
          ref: ${{ vars.BUFFERITE_TOOL_REF || 'main' }}
          path: .bufferite-tool
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install tooling dependencies
        working-directory: .bufferite-tool
        run: flutter pub get

      - name: Load package signing key
        shell: bash
        env:
          PACKAGE_KEY: ${{ secrets.REGISTRY_PACKAGE_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f keys/registry_keys.json ]; then
            echo "::error::keys/registry_keys.json belum ada."
            exit 1
          fi
          if [ -z "${PACKAGE_KEY:-}" ]; then
            echo "::error::Secret REGISTRY_PACKAGE_KEY belum diisi."
            exit 1
          fi
          umask 077
          printf '%s' "$PACKAGE_KEY" > "$RUNNER_TEMP/package-key.json"
          jq -e '.algorithm == "ed25519" and (.privateKey | type == "string")' \
            "$RUNNER_TEMP/package-key.json" > /dev/null
          key_id="$(jq -r '.keyId' "$RUNNER_TEMP/package-key.json")"
          jq -e --arg id "$key_id" '
            any(.keys[];
              .keyId == $id and
              .usage == "package" and
              .status == "active")
          ' keys/registry_keys.json > /dev/null

      - name: Verify signed index
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f release/registry.json ]; then
            echo "::error::release/registry.json belum ada."
            exit 1
          fi
          if [ ! -f release/registry.json.sig ]; then
            echo "::error::release/registry.json.sig belum ada."
            exit 1
          fi
          base_url="$(jq -r '.baseUrl' registry-source.json)"
          (
            cd .bufferite-tool
            dart run tool/registry_cli.dart verify index \
              --in "$GITHUB_WORKSPACE/release/registry.json" \
              --sig "$GITHUB_WORKSPACE/release/registry.json.sig" \
              --keyring "$GITHUB_WORKSPACE/keys/registry_keys.json" \
              --base-url "$base_url"
          )

      - name: Download and verify previous index
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          base_url="$(jq -r '.baseUrl' registry-source.json)"
          status="$(curl -sS -o "$RUNNER_TEMP/previous.json" \
            -w '%{http_code}' --retry 2 --retry-delay 2 --max-time 30 \
            "$base_url" || true)"
          if [ "$status" = "404" ]; then
            rm -f "$RUNNER_TEMP/previous.json"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Belum ada indeks publik; ini deploy pertama."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Gagal mengambil indeks lama (HTTP $status)."
            exit 1
          fi
          curl -fsSL --retry 2 --retry-delay 2 --max-time 30 \
            "${base_url}.sig" -o "$RUNNER_TEMP/previous.json.sig"
          (
            cd .bufferite-tool
            dart run tool/registry_cli.dart verify index \
              --in "$RUNNER_TEMP/previous.json" \
              --sig "$RUNNER_TEMP/previous.json.sig" \
              --keyring "$GITHUB_WORKSPACE/keys/registry_keys.json" \
              --base-url "$base_url"
          )
          echo "path=$RUNNER_TEMP/previous.json" >> "$GITHUB_OUTPUT"

      - name: Rebuild and compare index
        shell: bash
        env:
          PREVIOUS_INDEX: ${{ steps.previous.outputs.path }}
        run: |
          set -euo pipefail
          generated_at="$(jq -r '.generatedAt' release/registry.json)"
          args=(
            build-index
            --source "$GITHUB_WORKSPACE/registry-source.json"
            --out "$RUNNER_TEMP/rebuilt.json"
            --keyring "$GITHUB_WORKSPACE/keys/registry_keys.json"
            --generated-at "$generated_at"
          )
          if [ -n "${PREVIOUS_INDEX:-}" ]; then
            args+=(--base "$PREVIOUS_INDEX")
            old_sequence="$(jq -r '.sequence' "$PREVIOUS_INDEX")"
            new_sequence="$(jq -r '.sequence' release/registry.json)"
            if [ "$new_sequence" -le "$old_sequence" ]; then
              echo "::error::sequence baru ($new_sequence) harus lebih besar dari indeks lama ($old_sequence)."
              exit 1
            fi
          fi
          (cd .bufferite-tool && dart run tool/registry_cli.dart "${args[@]}")
          # shellcheck disable=SC2312
          if ! cmp -s "$RUNNER_TEMP/rebuilt.json" release/registry.json; then
            echo "::error::Indeks bertanda tangan tidak cocok dengan rebuild deterministik."
            exit 1
          fi
          echo "Indeks bertanda tangan cocok dengan rebuild deterministik."

      - name: Check immutable versions
        shell: bash
        env:
          PREVIOUS_INDEX: ${{ steps.previous.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIOUS_INDEX:-}" ]; then
            echo "Deploy pertama; pemeriksaan immutability dilewati."
            exit 0
          fi
          jq -e --slurpfile next release/registry.json '
            all(.plugins[]; . as $old |
              ([ $next[0].plugins[] |
                 select(.pluginId == $old.pluginId and .version == $old.version)
               ][0]) as $new |
              ($new != null) and
              ($new.sha256 == $old.sha256) and
              ($new.downloadUrl == $old.downloadUrl)
            )
          ' "$PREVIOUS_INDEX" > /dev/null
          echo "Semua versi lama tetap ada dengan hash dan URL yang sama."

      - name: Sign and verify packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(jq -r '.packages[].path // empty' registry-source.json)
          for rel in "${paths[@]}"; do
            if [[ "$rel" != packages/* || "$rel" == *".."* ||
              "$rel" == /* ]] ||
              ! [[ "$rel" =~ ^packages/[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::Path paket tidak aman: $rel"
              exit 1
            fi
            if [ -L "$rel" ] || [ ! -f "$rel" ]; then
              echo "::error::Paket tidak valid: $rel"
              exit 1
            fi
            (
              cd .bufferite-tool
              dart run tool/registry_cli.dart sign package \
                --in "$GITHUB_WORKSPACE/$rel" \
                --out "$GITHUB_WORKSPACE/$rel.sig" \
                --key "$RUNNER_TEMP/package-key.json"
              dart run tool/registry_cli.dart verify package \
                --in "$GITHUB_WORKSPACE/$rel" \
                --sig "$GITHUB_WORKSPACE/$rel.sig" \
                --keyring "$GITHUB_WORKSPACE/keys/registry_keys.json"
            )
          done

      - name: Stage site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/registry/v1/packages
          cp -R packages/. _site/registry/v1/packages/
          cp release/registry.json _site/registry/v1/registry.json
          cp release/registry.json.sig _site/registry/v1/registry.json.sig
          host="$(jq -r '.baseUrl' registry-source.json | sed -E 's#^https://([^/]+).*#\1#')"
          if [[ "$host" != *.github.io ]]; then
            printf '%s\n' "$host" > _site/CNAME
          fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
